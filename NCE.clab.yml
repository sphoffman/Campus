    - endpoints: [ "BD-1:et-0/0/6", "BD-2:et-0/0/6" ]
    - endpoints: [ "host1:eth2", "vQFX1:ge-0/0/3" ]
    - endpoints: [ "host1:eth3", "vQFX1:ge-0/0/4" ]
    - endpoints: [ "host1:eth4", "vQFX1:ge-0/0/5" ]
    - endpoints: [ "host1:eth5", "vQFX1:ge-0/0/6" ]
