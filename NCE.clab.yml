      kind: juniper_vjunosswitch
      image: vrnetlab/juniper_vjunos-switch:26.2R1.7
      startup-config: configs/junos/ABR-QFX/startup-config.cfg

    vMX1:
      kind: juniper_vjunosrouter
      image: vrnetlab/juniper_vjunos-router:26.2R1.7
      startup-config: configs/junos/vMX1/startup-config.cfg
    Remote-Host:
      kind: linux
      image: ghcr.io/sphoffman/labhost:1.4
      binds:
        - ./configs:/config
        - ./pcaps:/pcaps
      cap-add:
        - NET_ADMIN
        - NET_RAW
      sysctls:
        net.ipv4.tcp_l3mdev_accept: "1"
    host4:
      kind: linux
      image: ghcr.io/sphoffman/labhost:1.4
      binds:
        - ./configs:/config
        - ./pcaps:/pcaps
      cap-add:
        - NET_ADMIN
        - NET_RAW
      sysctls:
        net.ipv4.tcp_l3mdev_accept: "1"
  links:
    - endpoints: [ "ABR-1:ge-0/0/0", "ABR-2:ge-0/0/0" ]
    - endpoints: [ "DC-1:ge-0/0/0", "DC-2:ge-0/0/0" ]
    - endpoints: [ "DC-1:ge-0/0/1", "ABR-1:ge-0/0/1" ]
    - endpoints: [ "DC-2:ge-0/0/2", "ABR-2:ge-0/0/2" ]
