name: NCE

topology:
  nodes:
    ABR-1:
      kind: juniper_vjunosrouter
      image: vrnetlab/juniper_vjunos-router:26.2R1.7
      startup-config: configs/junos/ABR-1/startup-config.cfg
    ABR-2:
      kind: juniper_vjunosrouter
      image: vrnetlab/juniper_vjunos-router:26.2R1.7
      startup-config: configs/junos/ABR-2/startup-config.cfg
    DC-1:
      kind: juniper_vjunosrouter
      image: vrnetlab/juniper_vjunos-router:26.2R1.7
      startup-config: configs/junos/DC-1/startup-config.cfg
    DC-2:
      kind: juniper_vjunosrouter
      image: vrnetlab/juniper_vjunos-router:26.2R1.7
      startup-config: configs/junos/DC-2/startup-config.cfg
    BD-1:
      kind: juniper_vjunosevolved
      image: vrnetlab/juniper_vjunosevolved:26.2R1.7-EVO
      startup-config: configs/junos/BD-1/startup-config.cfg
    BD-2:
      kind: juniper_vjunosevolved
      image: vrnetlab/juniper_vjunosevolved:26.2R1.7-EVO
      startup-config: configs/junos/BD-2/startup-config.cfg
    vQFX1:
      kind: juniper_vjunosswitch
      image: vrnetlab/juniper_vjunos-switch:26.2R1.7
      startup-config: configs/junos/vQFX1/startup-config.cfg
    vQFX2:
      kind: juniper_vjunosswitch
      image: vrnetlab/juniper_vjunos-switch:26.2R1.7
      startup-config: configs/junos/vQFX2/startup-config.cfg
    vQFX3:
      kind: juniper_vjunosswitch
      image: vrnetlab/juniper_vjunos-switch:26.2R1.7
      startup-config: configs/junos/vQFX3/startup-config.cfg
    host1:
      kind: linux
      image: ghcr.io/sphoffman/labhost:1.4
      binds:
        - ./configs:/config
        - ./pcaps:/pcaps
      cap-add:
        - NET_ADMIN
        - NET_RAW
      sysctls:
        net.ipv4.tcp_l3mdev_accept: "1"
    host2:
      kind: linux
      image: ghcr.io/sphoffman/labhost:1.4
      binds:
        - ./configs:/config
        - ./pcaps:/pcaps
      cap-add:
        - NET_ADMIN
        - NET_RAW
      sysctls:
        net.ipv4.tcp_l3mdev_accept: "1"
    host3:
      kind: linux
      image: ghcr.io/sphoffman/labhost:1.4
      binds:
        - ./configs:/config
        - ./pcaps:/pcaps
      cap-add:
        - NET_ADMIN
        - NET_RAW
      sysctls:
        net.ipv4.tcp_l3mdev_accept: "1"
    DC-Host:
      kind: linux
      image: ghcr.io/sphoffman/labhost:1.4
      binds:
        - ./configs:/config
        - ./pcaps:/pcaps
      cap-add:
        - NET_ADMIN
        - NET_RAW
      sysctls:
        net.ipv4.tcp_l3mdev_accept: "1"
    ABR-Host:
      kind: linux
      image: ghcr.io/sphoffman/labhost:1.4
      binds:
        - ./configs:/config
        - ./pcaps:/pcaps
      cap-add:
        - NET_ADMIN
        - NET_RAW
      sysctls:
        net.ipv4.tcp_l3mdev_accept: "1"
    DC-vQFX:
      kind: juniper_vjunosswitch
      image: vrnetlab/juniper_vjunos-switch:26.2R1.7
      startup-config: configs/junos/DC-vQFX/startup-config.cfg
