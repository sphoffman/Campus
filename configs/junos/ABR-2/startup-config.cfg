policy-options {
    policy-statement export_default {
        inactive: term peer {
            from {
                protocol local;
                neighbor 10.0.0.2;
            }
            then accept;
        }
        term 1 {
            from {
                protocol static;
                route-filter 0.0.0.0/0 exact;
            }
            then accept;
        }
        term 2 {
            then reject;
        }
    }
    policy-statement export_into_ospf {
        term 1 {
            from protocol [ direct static ];
            then accept;
        }
    }
    policy-statement export_local {
        term 1 {
            from protocol direct;
            then accept;
        }
    }
    policy-statement export_to_DCs {
        term direct {
            from protocol direct;
            then accept;
        }
        term static {
            from protocol static;
            then accept;
        }
    }
    policy-statement reject {
        term reject {
            then reject;
        }
    }
}
